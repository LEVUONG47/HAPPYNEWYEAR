<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chúc Mừng Năm Mới 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <!-- Lock orientation to portrait on mobile -->
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <link rel="shortcut icon" type="image/png" href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Russo+One&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Mobile full screen support */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      /* Support for notch on iPhone X+ */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    
    /* Portrait mode optimization */
    @media (orientation: portrait) {
      .curved-text-container svg {
        width: clamp(280px, 80vw, 500px);
      }
      .curved-text {
        font-size: clamp(32px, 8vw, 42px);
      }
      .year-number {
        font-size: clamp(2.5rem, 10vw, 4rem);
      }
      .wish-item {
        font-size: clamp(1.1rem, 4vw, 1.6rem);
        max-width: min(320px, 90vw);
      }
    }
    
    /* Start screen for sound */
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .start-screen h1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2rem, 10vw, 4rem);
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
      padding: 0 20px;
      text-align: center;
    }
    .start-screen p {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: #fff;
      animation: blink 1.5s ease-in-out infinite;
      padding: 0 20px;
      text-align: center;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .start-screen.hidden { display: none; }

    /* Video screen */
    .video-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9998;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .video-screen.hidden { display: none; }
    .video-screen video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .curved-text-container {
      position: fixed;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }
    .curved-text-container svg {
      width: clamp(240px, 70vw, 500px);
      height: auto;
    }
    .curved-text {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(28px, 7vw, 38px);
      fill: url(#goldGradient);
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
    }
    .year-display {
      position: fixed;
      top: clamp(70px, 12vh, 120px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
      text-align: center;
    }
    .year-number {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      color: #fff;
      text-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366, 0 0 45px #ff3366;
      font-weight: 900;
    }
    .zodiac-info {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }
    .wish-item {
      position: fixed;
      z-index: 80;
      pointer-events: none;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1rem, 3.5vw, 1.5rem);
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 107, 107, 0.6), 0 2px 8px rgba(0,0,0,0.9);
      opacity: 0;
      max-width: min(350px, 85vw);
      text-align: center;
      padding: 8px 12px;
      line-height: 1.4;
    }
    .wish-item.show {
      animation: wishFade 5s ease-in-out forwards, sparkle 0.5s ease-in-out infinite;
    }
    @keyframes wishFade {
      0% { opacity: 0; transform: scale(0.8); }
      15% { opacity: 1; transform: scale(1); }
      85% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); }
    }
    @keyframes sparkle {
      0%, 100% { text-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 107, 107, 0.6); }
      50% { text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 25px rgba(255, 215, 0, 1), 0 0 35px rgba(255, 107, 107, 0.8); }
    }
    
    /* Fullscreen button for mobile */
    .fullscreen-mobile-btn {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      right: 20px;
      z-index: 9998;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-family: 'Russo One', sans-serif;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      transition: all 0.3s ease;
      animation: bounce 2s ease-in-out infinite;
    }
    
    .fullscreen-mobile-btn:active {
      transform: scale(0.95);
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    /* Exit fullscreen button */
    .exit-fullscreen-btn {
      position: fixed;
      top: max(20px, env(safe-area-inset-top, 20px));
      right: 20px;
      z-index: 99999;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .exit-fullscreen-btn:active {
      transform: scale(0.9);
      background: rgba(255, 0, 0, 0.7);
    }
    
    /* Hide fullscreen button on desktop */
    @media (min-width: 1024px) {
      .fullscreen-mobile-btn,
      .exit-fullscreen-btn {
        display: none !important;
      }
    }
  </style>
</head>
<body>
<!-- Start Screen - Click to enable sound -->
<div class="start-screen" id="startScreen">
  <h1>🎆 Chúc Mừng Năm Mới 2026 🎆</h1>
  <p>👆 Nhấn vào đây để bắt đầu 👆</p>
</div>

</button>

<!-- Video Screen - Background -->

<!-- Wishes Container -->

<!-- Curved Title -->

</div>

<!-- Year -->

  <div class="year-number">2026</div>
</div>

<!-- SVG Icons -->
<div style="height:0;width:0;position:absolute;visibility:hidden;">

<!-- App -->

<script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/fscreen%401.0.1.js"></script>
<script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/Stage%400.1.4.js"></script>
<script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/MyMath.js"></script>
<script src="./script.js" onload="console.log('script.js loaded successfully')" onerror="console.error('ERROR: script.js failed to load!')"></script>

<script>
(function() {
  console.log('=== MAIN SCRIPT STARTED ===');
  
  // Prevent fireworks from starting automatically
  window.videoCompleted = false;
  
  // Fullscreen and orientation management
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var exitFullscreenBtn = document.getElementById('exitFullscreenBtn');
  var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  
  // Show fullscreen button on mobile after start screen
  if (isMobile) {
    setTimeout(function() {
      fullscreenBtn.style.display = 'flex';
    }, 500);
  }
  
  // Fullscreen button click
  fullscreenBtn.addEventListener('click', async function() {
    try {
      // Request fullscreen
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        await elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        await elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        await elem.msRequestFullscreen();
      }
      
      // Lock to landscape orientation
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock('landscape');
          console.log('Orientation locked to landscape');
        } catch(e) {
          console.log('Orientation lock not supported:', e);
        }
      }
      
      // Hide fullscreen button, show exit button
      fullscreenBtn.style.display = 'none';
      exitFullscreenBtn.style.display = 'flex';
      
    } catch(err) {
      console.error('Fullscreen error:', err);
      alert('Không thể vào chế độ toàn màn hình. Vui lòng xoay ngang điện thoại thủ công.');
    }
  });
  
  // Exit fullscreen button click
  exitFullscreenBtn.addEventListener('click', function() {
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
  });
  
  // Listen for fullscreen changes
  document.addEventListener('fullscreenchange', handleFullscreenChange);
  document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
  document.addEventListener('msfullscreenchange', handleFullscreenChange);
  
  function handleFullscreenChange() {
    var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    
    if (!isFullscreen) {
      // Exited fullscreen
      fullscreenBtn.style.display = isMobile ? 'flex' : 'none';
      exitFullscreenBtn.style.display = 'none';
      
      // Unlock orientation
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }
  }
  
  // Override sound manager to prevent sounds before video completes
  window.addEventListener('load', function() {
    if (typeof soundManager !== 'undefined' && soundManager.playSound) {
      var originalPlaySound = soundManager.playSound;
      soundManager.playSound = function() {
        if (window.videoCompleted) {
          originalPlaySound.apply(soundManager, arguments);
        }
      };
    }
  });
  
  // Start screen - enable sound on click and play video
  var startScreen = document.getElementById('startScreen');
  var mainVideo = document.getElementById('mainVideo');
  
  // Debug: Check video load
  mainVideo.addEventListener('loadeddata', function() {
    console.log('Video loaded successfully!');
  });
  
  mainVideo.addEventListener('error', function(e) {
    console.error('Video error:', e);
  });
  
  startScreen.addEventListener('click', function() {
    startScreen.classList.add('hidden');
    // Show video by adding class
    mainVideo.classList.add('show-background');
    console.log('Video display enabled via CSS class');
    
    // Add class to body for rotation message
    document.body.classList.add('video-playing');
    
    // Unmute video for sound
    mainVideo.muted = false;
    
    var playPromise = mainVideo.play();
    if (playPromise !== undefined) {
      playPromise.then(function() {
        console.log('Video playing!');
      }).catch(function(error) {
        console.error('Video play error:', error);
        // If unmuted fails, try muted
        mainVideo.muted = true;
        mainVideo.play();
      });
    }
  });
  
  // Listen for video time update to pause at 10s
  mainVideo.addEventListener('timeupdate', function() {
    if (mainVideo.currentTime >= 10.0 && !mainVideo.paused) {
      console.log('=== VIDEO REACHED 10s ===');
      mainVideo.pause();
      mainVideo.currentTime = 10.0;
      
      window.videoCompleted = true;
      
      // Remove video-playing class
      document.body.classList.remove('video-playing');
      
      console.log('Video ended at 10s - Transitioning to fireworks...');
      console.log('Video element:', mainVideo);
      console.log('Video display:', mainVideo.style.display);
      
      // Smooth fade out video
      mainVideo.style.transition = 'opacity 1s ease-out';
      mainVideo.style.opacity = '0';
      console.log('Video fading out...');
      
      // After fade out, hide video and start fireworks
      setTimeout(function() {
        mainVideo.style.display = 'none';
        console.log('Video hidden');
        console.log('Calling startFireworks()...');
        startFireworks();
      }, 1000);
    }
  });
  
  // Function to start fireworks
  function startFireworks() {
    console.log('=== START FIREWORKS FUNCTION ===');
    console.log('Checking for script.js dependencies...');
    
    // Add timeout fallback in case script.js is slow
    var maxWaitTime = 5000; // 5 seconds max wait
    var startTime = Date.now();
    
    var checkInit = setInterval(function() {
      var elapsed = Date.now() - startTime;
      
      // Check if dependencies are ready
      if (typeof togglePause !== 'undefined' && typeof store !== 'undefined') {
        clearInterval(checkInit);
        console.log('Dependencies ready! Starting fireworks...');
        
        // Make sure the stage container is visible
        var stageContainer = document.querySelector('.stage-container');
        if (stageContainer) {
          console.log('Stage container found');
          stageContainer.classList.remove('remove');
          stageContainer.style.visibility = 'visible';
          stageContainer.style.opacity = '0';
          stageContainer.style.display = 'block';
          
          // Smooth fade in
          setTimeout(function() {
            stageContainer.style.transition = 'opacity 1s ease-in';
            stageContainer.style.opacity = '1';
            stageContainer.classList.add('show');
            console.log('Stage container visible');
          }, 50);
        } else {
          console.error('Stage container not found!');
        }
        
        // Show title and year text with fade in
        setTimeout(function() {
          var curvedText = document.querySelector('.curved-text-container');
          var yearDisplay = document.querySelector('.year-display');
          if (curvedText) {
            curvedText.style.opacity = '1';
            console.log('Title shown');
          }
          if (yearDisplay) {
            yearDisplay.style.opacity = '1';
            console.log('Year shown');
          }
        }, 500);
        
        // Remove loading screen if still present
        var loadingInit = document.querySelector('.loading-init');
        if (loadingInit) {
          loadingInit.remove();
          console.log('Loading screen removed');
        }
        
        // Unpause the fireworks
        try {
          togglePause(false);
          console.log('Fireworks unpaused');
        } catch(e) {
          console.error('Error unpausing:', e);
        }
        
        // Enable sound for fireworks
        if (typeof toggleSound !== 'undefined') {
          try {
            toggleSound(true);
            console.log('Sound enabled');
          } catch(e) {
            console.error('Error enabling sound:', e);
          }
        }
        
        // Enable auto-launch
        if (store && store.state && store.state.config) {
          store.state.config.autoLaunch = true;
          console.log('Auto-launch enabled');
        }
        
        // Start wishes after fireworks start
        setTimeout(scheduleWish, 1500);
        
      } else if (elapsed > maxWaitTime) {
        // Timeout - script.js might not have loaded
        clearInterval(checkInit);
        console.error('TIMEOUT: script.js dependencies not ready after 5s');
        console.error('togglePause:', typeof togglePause);
        console.error('store:', typeof store);
        
        // Show error message to user
        alert('Lỗi: Không thể tải pháo hoa. Vui lòng refresh trang (F5).');
      } else {
        // Still waiting
        if (elapsed % 1000 < 100) { // Log every second
          console.log('Waiting for dependencies... (' + Math.floor(elapsed/1000) + 's)');
        }
      }
    }, 100);
  }

  // Wishes array
  var wishes = [
  "Năm mới cười nhiều hơn, stress ít lại!",
  "Tiền vô ào ào, deadline tự biến mất!",
  "Học hành nhẹ nhàng, thi đâu đậu đó!",
  "Công việc mượt mà, sếp luôn gật đầu!",
  "Tình duyên khởi sắc, crush chủ động nhắn tin!",
  "Sức khỏe full pin, ngủ ngon không mộng mị!",
  "Ví luôn dày, tài khoản không bao giờ âm!",
  "Ra đường gặp may, về nhà gặp vui!",
  "Mọi dự định đều chạy mượt như code không bug!",
  "Năm mới bớt lười, nhiều động lực!",
  "Bạn bè đông đủ, cuộc sống thêm chill!",
  "Tết này và cả năm đều thật rực rỡ!"
  ];

  var container = document.getElementById('wishesContainer');

  function showRandomWish() {
    var wish = document.createElement('div');
    wish.className = 'wish-item';
    wish.textContent = wishes[Math.floor(Math.random() * wishes.length)];
    
    // Optimize positioning for portrait mode
    var isPortrait = window.innerHeight > window.innerWidth;
    
    if (isPortrait) {
      // Portrait: spread wishes more in middle area
      var top = 25 + Math.random() * 50; // 25-75% height
      var left = 10 + Math.random() * 80; // 10-90% width (centered)
    } else {
      // Landscape: original positioning
      var top = 22 + Math.random() * 60;
      var left = 5 + Math.random() * 70;
    }
    
    wish.style.top = top + '%';
    wish.style.left = left + '%';
    
    container.appendChild(wish);
    
    setTimeout(function() { wish.classList.add('show'); }, 50);
    setTimeout(function() { wish.remove(); }, 5500);
  }

  function scheduleWish() {
    showRandomWish();
    setTimeout(scheduleWish, 2500 + Math.random() * 2000);
  }

  // Don't start wishes automatically - wait for fireworks to start
  // setTimeout(scheduleWish, 1500);
})();
</script>
</body>
</html>
