<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chúc Mừng Năm Mới 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="shortcut icon" type="image/png" href="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/firework-burst-icon-v2.png">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Russo+One&family=Great+Vibes&family=Montserrat:wght@100;300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Start screen for sound */
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Background hình ảnh cho màn hình bắt đầu - thay URL bằng link ảnh của bạn */
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1514897575457-c4db467cf78e?q=80&w=2070') no-repeat center center;
      background-size: cover;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .start-screen h1 {
      font-family: 'Great Vibes', cursive;
      font-weight: 700;
      font-size: clamp(3.5rem, 10vw, 6rem);
      color: #ffd700;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 50px rgba(255, 215, 0, 0.5);
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
      letter-spacing: 4px;
    }
    .start-screen p {
      font-family: 'Russo One', sans-serif;
      font-size: 1.2rem;
      color: #fff;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .start-screen.hidden { display: none; }

    .curved-text-container {
      position: fixed;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }
    .curved-text-container svg {
      width: clamp(280px, 60vw, 500px);
      height: auto;
    }
    .curved-text {
      font-family: 'Great Vibes', cursive;
      font-size: 38px;
      fill: url(#goldGradient);
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
    }
    .year-display {
      position: fixed;
      top: clamp(70px, 12vh, 110px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
      text-align: center;
    }
    .year-number {
      font-family: 'Russo One', sans-serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: #fff;
      text-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
    }
    .zodiac-info {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(0.8rem, 2vw, 1.1rem);
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700cc;
    }
    .wish-item {
      position: fixed;
      z-index: 80;
      pointer-events: none;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 107, 107, 0.6), 0 2px 8px rgba(0,0,0,0.9);
      opacity: 0;
      max-width: 350px;
      text-align: center;
      padding: 10px 15px;
    }
    .wish-item.show {
      animation: wishFade 5s ease-in-out forwards, sparkle 0.5s ease-in-out infinite;
    }
    @keyframes wishFade {
      0% { opacity: 0; transform: scale(0.8); }
      15% { opacity: 1; transform: scale(1); }
      85% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.8); }
    }
    @keyframes sparkle {
      0%, 100% { text-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 107, 107, 0.6); }
      50% { text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 25px rgba(255, 215, 0, 1), 0 0 35px rgba(255, 107, 107, 0.8); }
    }
  </style>
</head>
<body>
<!-- Start Screen - Click to enable sound -->
<div class="start-screen" id="startScreen">
  <h1 class="start-btn-text">Bắt đầu</h1>
  <p style="margin-top: 10px; font-size: 0.9rem; opacity: 0.8;">Nhấn để bắt đầu</p>
</div>

<!-- Countdown -->
<div id="countdown" class="countdown-container hidden">
  <div class="countdown-number"></div>
</div>

<!-- Curved Title -->
<div class="curved-text-container">
  <svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#ffd700"><animate attributeName="stop-color" values="#ffd700;#ff6b6b;#ffd700" dur="3s" repeatCount="indefinite"/></stop>
        <stop offset="50%" style="stop-color:#ff6b6b"><animate attributeName="stop-color" values="#ff6b6b;#ffd700;#ff6b6b" dur="3s" repeatCount="indefinite"/></stop>
        <stop offset="100%" style="stop-color:#ffd700"><animate attributeName="stop-color" values="#ffd700;#ff6b6b;#ffd700" dur="3s" repeatCount="indefinite"/></stop>
      </linearGradient>
      <path id="textCurve" d="M 20,75 Q 200,5 380,75" fill="transparent"/>
    </defs>
    <text class="curved-text"><textPath href="#textCurve" startOffset="50%" text-anchor="middle">Chúc Mừng Năm Mới</textPath></text>
  </svg>
</div>

<!-- Year -->
<div class="year-display" style="opacity: 0; transition: opacity 2s;">
  <div class="year-number">
    <span class="year-prefix">202</span><span class="digit-5">5</span><span class="digit-6">6</span>
  </div>
  <div class="zodiac-info">Năm Bính Ngọ - Mã Đáo Thành Công</div>
</div>

<!-- Wishes Container -->
<div id="wishesContainer"></div>

<!-- SVG Icons -->
<div style="height:0;width:0;position:absolute;visibility:hidden;">
  <svg xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></symbol>
    <symbol id="icon-sound-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></symbol>
    <symbol id="icon-sound-off" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
  </svg>
</div>

<!-- App -->
<div class="container">
  <div class="loading-init">
    <div class="loading-init__header">Loading</div>
    <div class="loading-init__status">Assembling Shells</div>
  </div>
  <div class="stage-container remove">
    <div class="canvas-container">
      <canvas id="trails-canvas"></canvas>
      <canvas id="main-canvas"></canvas>
    </div>
    <div class="controls">
      <div class="btn pause-btn"><svg fill="white" width="24" height="24"><use href="#icon-pause" xlink:href="#icon-pause"></use></svg></div>
      <div class="btn sound-btn"><svg fill="white" width="24" height="24"><use href="#icon-sound-on" xlink:href="#icon-sound-on"></use></svg></div>
      <div style="flex-grow:1;"></div>
      <div class="btn settings-btn"><svg fill="white" width="24" height="24"><use href="#icon-settings" xlink:href="#icon-settings"></use></svg></div>
    </div>
    <div class="menu hide">
      <div class="menu__inner-wrap">
        <div class="btn btn--bright close-menu-btn"><svg fill="white" width="24" height="24"><use href="#icon-close" xlink:href="#icon-close"></use></svg></div>
        <div class="menu__header">Settings</div>
        <div class="menu__subheader">Click any label for info</div>
        <form>
          <div class="form-option form-option--select"><label class="shell-type-label">Shell Type</label><select class="shell-type"></select></div>
          <div class="form-option form-option--select"><label class="shell-size-label">Shell Size</label><select class="shell-size"></select></div>
          <div class="form-option form-option--select"><label class="quality-ui-label">Quality</label><select class="quality-ui"></select></div>
          <div class="form-option form-option--select"><label class="sky-lighting-label">Sky Lighting</label><select class="sky-lighting"></select></div>
          <div class="form-option form-option--select"><label class="scaleFactor-label">Scale</label><select class="scaleFactor"></select></div>
          <div class="form-option form-option--checkbox"><label class="auto-launch-label">Auto Fire</label><input class="auto-launch" type="checkbox" /></div>
          <div class="form-option form-option--checkbox form-option--finale-mode"><label class="finale-mode-label">Finale Mode</label><input class="finale-mode" type="checkbox" /></div>
          <div class="form-option form-option--checkbox"><label class="hide-controls-label">Hide Controls</label><input class="hide-controls" type="checkbox" /></div>
          <div class="form-option form-option--checkbox form-option--fullscreen"><label class="fullscreen-label">Fullscreen</label><input class="fullscreen" type="checkbox" /></div>
          <div class="form-option form-option--checkbox"><label class="long-exposure-label">Open Shutter</label><input class="long-exposure" type="checkbox" /></div>
        </form>
        <div class="credits">Chúc Mừng Năm Mới 2026</div>
      </div>
    </div>
  </div>
  <div class="help-modal">
    <div class="help-modal__overlay"></div>
    <div class="help-modal__dialog">
      <div class="help-modal__header"></div>
      <div class="help-modal__body"></div>
      <button type="button" class="help-modal__close-btn">Close</button>
    </div>
  </div>
</div>


<script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/fscreen%401.0.1.js"></script>
<script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/Stage%400.1.4.js"></script>
<script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/329180/MyMath.js"></script>
<script src="./script.js"></script>

<script>
(function() {
  // PAUSE pháo hoa ngay khi page load
  window.addEventListener('load', function() {
    setTimeout(function() {
      // Tìm và click nút pause để dừng pháo hoa
      var pauseBtn = document.querySelector('.pause-btn');
      if (pauseBtn) {
        var svg = pauseBtn.querySelector('use');
        // Nếu đang play (icon pause), thì click để pause
        if (svg && svg.getAttribute('href') === '#icon-pause') {
          pauseBtn.click();
          console.log('Paused fireworks on load');
        }
      }
    }, 100);
  });
  
  // Start screen - click to begin
  var startScreen = document.getElementById('startScreen');
  var countdown = document.getElementById('countdown');
  var countdownNumber = document.querySelector('.countdown-number');
  var yearDisplay = document.querySelector('.year-display');
  var yearNumber = document.querySelector('.year-number');
  var html = document.documentElement;

  // Wait for user click to start
  startScreen.addEventListener('click', function() {
    startScreen.classList.add('hidden');
    countdown.classList.remove('hidden');
    
    // Disable click trên stage để không bắn pháo hoa khi countdown
    var stageContainer = document.querySelector('.stage-container');
    if (stageContainer) {
      stageContainer.style.pointerEvents = 'none';
    }
    
    // Start countdown: 3, 2, 1
    var countdownSequence = ['3', '2', '1'];
    var currentIndex = 0;
    
    countdownNumber.textContent = countdownSequence[currentIndex];

    var interval = setInterval(function() {
      currentIndex++;
      if (currentIndex < countdownSequence.length) {
        countdownNumber.textContent = countdownSequence[currentIndex];
      } else {
        clearInterval(interval);
        
        // Đợi 1.5 giây sau số 1 để thấy rõ countdown xong
        setTimeout(function() {
          countdown.classList.add('hidden');
          
          // Show Background and Year
          html.classList.add('show-background');
          yearDisplay.style.opacity = '1';
          
          // Enable click trên stage - cho phép user click bắn pháo hoa
          if (stageContainer) {
            stageContainer.style.pointerEvents = 'auto';
          }
          
          // Unpause pháo hoa (tự động bắn) và bật âm thanh sau 1 giây
          setTimeout(function() {
            // Unpause pháo hoa - tự động bắn
            var pauseBtn = document.querySelector('.pause-btn');
            if (pauseBtn) {
              var svg = pauseBtn.querySelector('use');
              // Nếu đang pause (icon play), thì click để unpause
              if (svg && svg.getAttribute('href') === '#icon-play') {
                pauseBtn.click();
                console.log('Unpaused - fireworks auto-launch');
              }
            }
            
            // Bật âm thanh
            var soundBtn = document.querySelector('.sound-btn');
            if (soundBtn) {
              var useEl = soundBtn.querySelector('use');
              if (useEl && useEl.getAttribute('href') === '#icon-sound-off') {
                soundBtn.click();
                console.log('Enabled sound');
              }
            }
          }, 1000);

          // Animate digit 6 flying in
          setTimeout(function() {
            yearNumber.classList.add('animate-digit');
          }, 1500);

          // Start Wishes
          setTimeout(scheduleWish, 2500);
        }, 1000);
      }
    }, 1000);
  });

  // Wishes array
  var wishes = [
    "Chúc năm mới an khang thịnh vượng!",
    "Mã đáo thành công, vạn sự như ý!",
    "Tài lộc dồi dào, tiền vào như nước!",
    "Gia đình hạnh phúc, sum vầy êm ấm!",
    "Sức khỏe tràn đầy, bình an may mắn!",
    "Công danh thăng tiến, sự nghiệp rạng ngời!",
    "Phúc Lộc Thọ đầy nhà!",
    "Xuân sang phú quý, năm mới hanh thông!",
    "Tình yêu viên mãn, hạnh phúc trọn đời!",
    "Năm Ngọ phi như ngựa chiến!",
    "Vạn sự như ý, tỷ sự như mơ!",
    "Tân niên vạn phúc!"
  ];

  var container = document.getElementById('wishesContainer');

  function showRandomWish() {
    var wish = document.createElement('div');
    wish.className = 'wish-item';
    wish.textContent = wishes[Math.floor(Math.random() * wishes.length)];
    
    var top = 22 + Math.random() * 60;
    var left = 5 + Math.random() * 70;
    
    wish.style.top = top + '%';
    wish.style.left = left + '%';
    
    container.appendChild(wish);
    
    setTimeout(function() { wish.classList.add('show'); }, 50);
    setTimeout(function() { wish.remove(); }, 5500);
  }

  function scheduleWish() {
    showRandomWish();
    setTimeout(scheduleWish, 2500 + Math.random() * 2000);
  }
})();
</script>
</body>
</html>
